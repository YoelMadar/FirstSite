<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 מתנות חתונה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #fdf6f0 0%, #f9f0f5 100%);
      min-height: 100vh;
      color: #3a2a3a;
      direction: rtl;
    }
    header {
      background: linear-gradient(135deg, #8b5e83 0%, #c0a060 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(139,94,131,0.3);
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 1px; }
    header p { font-size: 0.95rem; opacity: 0.85; margin-top: 4px; }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }
    .stat-card {
      background: linear-gradient(135deg, #f9f0f5, #fdf6f0);
      border: 2px solid #e8d5e8;
      border-radius: 12px;
      padding: 12px 20px;
      text-align: center;
      min-width: 130px;
    }
    .stat-card .num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #8b5e83;
    }
    .stat-card .lbl {
      font-size: 0.78rem;
      color: #8a7a8a;
      margin-top: 2px;
    }
    .stat-card.gold .num { color: #c0a060; }
    .stat-card.green .num { color: #4a9a6a; }

    .controls {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 2px solid #e8d5e8;
      border-radius: 25px;
      font-size: 1rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }
    .search-box input:focus { border-color: #8b5e83; }
    .search-box .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8b5e83;
      font-size: 1.1rem;
    }
    select {
      padding: 10px 16px;
      border: 2px solid #e8d5e8;
      border-radius: 25px;
      font-size: 0.9rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      cursor: pointer;
      background: white;
      color: #3a2a3a;
      direction: rtl;
    }
    select:focus { border-color: #8b5e83; }

    .filter-btns {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e8d5e8;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Heebo', sans-serif;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn.active { background: #8b5e83; color: white; border-color: #8b5e83; }
    .filter-btn:hover:not(.active) { border-color: #8b5e83; color: #8b5e83; }

    .export-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #c0a060, #a08040);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-family: 'Heebo', sans-serif;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .export-btn:hover { opacity: 0.85; }

    .table-wrapper {
      overflow-x: auto;
      padding: 0 10px 30px;
      max-width: 1000px;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-top: 16px;
    }
    thead tr {
      background: linear-gradient(135deg, #8b5e83, #a07090);
      color: white;
    }
    th {
      padding: 14px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
    }
    tbody tr {
      border-bottom: 1px solid #f0e8f0;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #fdf6fd; }
    tbody tr.has-gift { background: #f0faf4; }
    tbody tr.has-gift:hover { background: #e8f8ee; }
    tbody tr.group-header { background: linear-gradient(135deg, #f5ecf5, #fdf6f0); }
    tbody tr.group-header td {
      font-weight: 700;
      color: #8b5e83;
      font-size: 0.95rem;
      padding: 10px 16px;
      border-bottom: 2px solid #e8d5e8;
    }
    td {
      padding: 10px 16px;
      font-size: 0.9rem;
    }
    td.name { font-weight: 500; }
    td.group-cell { color: #8a7a8a; font-size: 0.82rem; }
    td.count { text-align: center; font-weight: 500; color: #8b5e83; }
    td.gift-cell { width: 140px; }
    .gift-input {
      width: 120px;
      padding: 7px 12px;
      border: 2px solid #e8d5e8;
      border-radius: 20px;
      font-size: 0.95rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
      background: white;
    }
    .gift-input:focus { border-color: #4a9a6a; box-shadow: 0 0 0 3px rgba(74,154,106,0.15); }
    .gift-input.filled { border-color: #4a9a6a; background: #f0faf4; font-weight: 600; color: #2a7a4a; }

    .result-count {
      text-align: center;
      padding: 8px;
      color: #8a7a8a;
      font-size: 0.85rem;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #8a7a8a;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .stats-bar { gap: 8px; padding: 12px; }
      .stat-card { min-width: 100px; padding: 10px 14px; }
      .stat-card .num { font-size: 1.3rem; }
      .controls { padding: 12px; gap: 8px; }
      th, td { padding: 8px 10px; font-size: 0.82rem; }
      .gift-input { width: 90px; padding: 6px 8px; }
      td.group-cell { display: none; }
    }
  </style>
</head>

<header>
  <h1>💍 מתנות החתונה</h1>
  <p>רשימת מוזמנים · הזנת מתנות · מעקב בזמן אמת</p>
</header>

<div class="stats-bar">
  <div class="stat-card gold">
    <div class="num" id="totalAmount">₪0</div>
    <div class="lbl">סה"כ מתנות</div>
  </div>
  <div class="stat-card green">
    <div class="num" id="paidCount">0</div>
    <div class="lbl">שילמו מתנה</div>
  </div>
  <div class="stat-card">
    <div class="num" id="remainCount">0</div>
    <div class="lbl">טרם הוזן</div>
  </div>
  <div class="stat-card">
    <div class="num" id="totalGuests">362</div>
    <div class="lbl">סה"כ מוזמנים</div>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="חפש שם מוזמן..." oninput="renderTable()">
    <span class="icon">🔍</span>
  </div>
  <select id="groupFilter" onchange="renderTable()">
    <option value="">כל הקבוצות</option>
  </select>
  <div class="filter-btns">
    <button class="filter-btn active" id="btn-all" onclick="setGiftFilter('all')">הכל</button>
    <button class="filter-btn" id="btn-paid" onclick="setGiftFilter('paid')">✅ שילמו</button>
    <button class="filter-btn" id="btn-unpaid" onclick="setGiftFilter('unpaid')">⏳ טרם הוזן</button>
  </div>
  <button class="export-btn" onclick="exportExcel()">📥 ייצוא לאקסל</button>
</div>

<div class="table-wrapper">
  <div class="result-count" id="resultCount"></div>
  <table id="guestsTable">

        <th style="text-align:center">מגיעים</th>
        <th style="text-align:center">מתנה (₪)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-results" id="noResults" style="display:none">לא נמצאו תוצאות 🔍</div>
</div>

let giftFilter = 'all';
let gifts = {};

function loadGifts() {
  const saved = localStorage.getItem('wedding_gifts_v1');
  if (saved) {
    try { gifts = JSON.parse(saved); } catch(e) { gifts = {}; }
  }
}

function saveGifts() {
  localStorage.setItem('wedding_gifts_v1', JSON.stringify(gifts));
  updateStats();
}

function updateStats() {
  const paid = Object.entries(gifts).filter(([k,v]) => v > 0);
  const total = paid.reduce((s,[,v]) => s + Number(v), 0);
  document.getElementById('totalAmount').textContent = '₪' + total.toLocaleString('he-IL');
  document.getElementById('paidCount').textContent = paid.length;
  document.getElementById('remainCount').textContent = GUESTS_DATA.length - paid.length;
}

function setGiftFilter(f) {
  giftFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + f).classList.add('active');
  renderTable();
}

function populateGroupFilter() {
  const groups = [...new Set(GUESTS_DATA.map(g => g.group).filter(Boolean))].sort();
  const sel = document.getElementById('groupFilter');
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
}

function renderTable() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const groupSel = document.getElementById('groupFilter').value;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  let filtered = GUESTS_DATA.filter(g => {
    const matchSearch = !search || g.name.toLowerCase().includes(search);
    const matchGroup = !groupSel || g.group === groupSel;
    const giftVal = Number(gifts[g.id] || 0);
    const matchGift = giftFilter === 'all' ||
      (giftFilter === 'paid' && giftVal > 0) ||
      (giftFilter === 'unpaid' && giftVal === 0);
    return matchSearch && matchGroup && matchGift;
  });

  document.getElementById('resultCount').textContent =
    filtered.length + ' תוצאות מתוך ' + GUESTS_DATA.length + ' מוזמנים';

  if (filtered.length === 0) {
    document.getElementById('noResults').style.display = '';
    document.getElementById('guestsTable').style.display = 'none';
    return;
  }
  document.getElementById('noResults').style.display = 'none';
  document.getElementById('guestsTable').style.display = '';

  filtered.forEach(g => {
    const giftVal = gifts[g.id] || '';
    const hasgift = Number(giftVal) > 0;
    const tr = document.createElement('tr');
    if (hasgift) tr.classList.add('has-gift');
    tr.innerHTML = \`
      <td class="name">\${g.name}</td>
      <td class="group-cell">\${g.group || ''}</td>
      <td class="count">\${g.count}</td>
      <td class="gift-cell">
        <input
          class="gift-input \${hasgift ? 'filled' : ''}"
          type="number"
          min="0"
          step="50"
          placeholder="סכום"
          value="\${giftVal}"
          data-id="\${g.id}"
          onchange="updateGift(this)"
          oninput="updateGift(this)"
        >
      </td>
    \`;
    tbody.appendChild(tr);
  });
}

function updateGift(input) {
  const id = input.getAttribute('data-id');
  const val = Number(input.value);
  if (val > 0) {
    gifts[id] = val;
    input.classList.add('filled');
    input.closest('tr').classList.add('has-gift');
  } else {
    delete gifts[id];
    input.classList.remove('filled');
    input.closest('tr').classList.remove('has-gift');
  }
  saveGifts();
}

function exportExcel() {
  const data = GUESTS_DATA.map(g => ({
    'שם מוזמן': g.name,
    'נייד': g.phone,
    'כמה מגיעים': g.count,
    'קבוצה': g.group,
    'מתנה (₪)': Number(gifts[g.id] || 0)
  }));

  const ws = XLSX.utils.json_to_sheet(data, { skipHeader: false });

  // Column widths
  ws['!cols'] = [
    {wch: 25}, {wch: 14}, {wch: 12}, {wch: 28}, {wch: 14}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'מתנות חתונה');

  // Summary sheet
  const paid = Object.entries(gifts).filter(([k,v]) => v > 0);
  const total = paid.reduce((s,[,v]) => s + Number(v), 0);
  const summaryData = [
    {'סטטיסטיקה': 'סה"כ מתנות', 'ערך': '₪' + total.toLocaleString('he-IL')},
    {'סטטיסטיקה': 'שילמו מתנה', 'ערך': paid.length + ' אנשים'},
    {'סטטיסטיקה': 'טרם הוזן', 'ערך': (GUESTS_DATA.length - paid.length) + ' אנשים'},
    {'סטטיסטיקה': 'סה"כ מוזמנים', 'ערך': GUESTS_DATA.length + ' אנשים'},
  ];
  const ws2 = XLSX.utils.json_to_sheet(summaryData);
  XLSX.utils.book_append_sheet(wb, ws2, 'סיכום');

  XLSX.writeFile(wb, 'מתנות_חתונה.xlsx');
}

// Init
loadGifts();
populateGroupFilter();
renderTable();
updateStats();
</script>
