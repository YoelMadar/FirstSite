<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 מתנות חתונה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #fdf6f0 0%, #f9f0f5 100%);
      min-height: 100vh;
      color: #3a2a3a;
      direction: rtl;
    }
    header {
      background: linear-gradient(135deg, #8b5e83 0%, #c0a060 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(139,94,131,0.3);
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 1px; }
    header p { font-size: 0.95rem; opacity: 0.85; margin-top: 4px; }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }
    .stat-card {
      background: linear-gradient(135deg, #f9f0f5, #fdf6f0);
      border: 2px solid #e8d5e8;
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
      min-width: 115px;
    }
    .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #8b5e83; }
    .stat-card .lbl { font-size: 0.75rem; color: #8a7a8a; margin-top: 2px; }
    .stat-card.gold .num { color: #c0a060; }
    .stat-card.green .num { color: #4a9a6a; }
    .stat-card.blue .num { color: #3a7abf; }
    .stat-card.orange .num { color: #d07030; }

    .controls {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: white;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box { flex: 1; min-width: 180px; position: relative; }
    .search-box input {
      width: 100%;
      padding: 9px 14px 9px 38px;
      border: 2px solid #e8d5e8;
      border-radius: 25px;
      font-size: 0.95rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }
    .search-box input:focus { border-color: #8b5e83; }
    .search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b5e83; }
    select {
      padding: 9px 14px;
      border: 2px solid #e8d5e8;
      border-radius: 25px;
      font-size: 0.88rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      cursor: pointer;
      background: white;
      color: #3a2a3a;
      direction: rtl;
    }
    select:focus { border-color: #8b5e83; }
    .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 7px 13px;
      border: 2px solid #e8d5e8;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'Heebo', sans-serif;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn.active { background: #8b5e83; color: white; border-color: #8b5e83; }
    .filter-btn:hover:not(.active) { border-color: #8b5e83; color: #8b5e83; }
    .export-btn {
      padding: 9px 18px;
      background: linear-gradient(135deg, #c0a060, #a08040);
      color: white; border: none; border-radius: 25px;
      font-size: 0.88rem; font-family: 'Heebo', sans-serif;
      cursor: pointer; font-weight: 500; transition: opacity 0.2s; white-space: nowrap;
    }
    .export-btn:hover { opacity: 0.85; }
    .add-btn {
      padding: 9px 18px;
      background: linear-gradient(135deg, #4a9a6a, #2a7a4a);
      color: white; border: none; border-radius: 25px;
      font-size: 0.88rem; font-family: 'Heebo', sans-serif;
      cursor: pointer; font-weight: 500; transition: opacity 0.2s; white-space: nowrap;
    }
    .add-btn:hover { opacity: 0.85; }

    .table-wrapper {
      overflow-x: auto;
      padding: 0 10px 30px;
      max-width: 1100px;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-top: 14px;
    }
    thead tr { background: linear-gradient(135deg, #8b5e83, #a07090); color: white; }
    th { padding: 12px 10px; font-size: 0.85rem; font-weight: 600; text-align: right; }
    tbody tr { border-bottom: 1px solid #f0e8f0; transition: background 0.15s; }
    tbody tr:hover { background: #fdf6fd; }
    tbody tr.has-gift { background: #f0faf4; }
    tbody tr.has-gift:hover { background: #e8f8ee; }
    tbody tr.custom-row { border-right: 3px solid #4a9a6a; }
    tbody tr.group-header td {
      background: linear-gradient(135deg, #ede0f0, #f5ecf5);
      font-weight: 700;
      color: #6a3a6a;
      font-size: 0.92rem;
      padding: 8px 12px;
      border-bottom: 2px solid #d8b8d8;
      border-top: 3px solid #c090c0;
      letter-spacing: 0.5px;
    }
    tbody tr.group-header .group-badge {
      display: inline-block;
      background: #8b5e83;
      color: white;
      border-radius: 12px;
      padding: 1px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-right: 8px;
      vertical-align: middle;
    }
    td { padding: 8px 10px; font-size: 0.87rem; }
    td.name { font-weight: 500; }
    td.group-cell { color: #8a7a8a; font-size: 0.8rem; }
    td.count { text-align: center; font-weight: 500; color: #8b5e83; }
    td.num-cell { text-align: center; }

    .num-input {
      width: 80px;
      padding: 5px 8px;
      border: 2px solid #e8d5e8;
      border-radius: 20px;
      font-size: 0.9rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
      background: white;
    }
    .gift-input:focus { border-color: #4a9a6a; box-shadow: 0 0 0 3px rgba(74,154,106,0.15); }
    .gift-input.filled { border-color: #4a9a6a; background: #f0faf4; font-weight: 600; color: #2a7a4a; }
    .arrived-input:focus { border-color: #3a7abf; box-shadow: 0 0 0 3px rgba(58,122,191,0.15); }
    .arrived-input.filled { border-color: #3a7abf; background: #f0f4fa; font-weight: 600; color: #1a5a9a; }

    .action-btns { display: flex; gap: 4px; justify-content: center; }
    .action-btn {
      width: 28px; height: 28px;
      border: none; border-radius: 50%;
      cursor: pointer; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.75; }
    .edit-btn { background: #e8f0fa; color: #3a7abf; }
    .delete-btn { background: #fae8e8; color: #bf3a3a; }

    .result-count { text-align: center; padding: 8px; color: #8a7a8a; font-size: 0.83rem; }
    .no-results { text-align: center; padding: 40px; color: #8a7a8a; font-size: 1.1rem; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 16px;
      padding: 0; width: 90%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      direction: rtl;
    }
    .modal-header {
      background: linear-gradient(135deg, #8b5e83, #a07090);
      color: white; padding: 16px 20px;
      border-radius: 16px 16px 0 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { font-size: 1.1rem; }
    .modal-close {
      background: none; border: none; color: white;
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    .modal-body { padding: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 500; margin-bottom: 5px; color: #5a4a5a; }
    .form-group input, .form-group select {
      width: 100%; padding: 9px 14px;
      border: 2px solid #e8d5e8; border-radius: 10px;
      font-size: 0.95rem; font-family: 'Heebo', sans-serif;
      outline: none; transition: border-color 0.2s; direction: rtl;
      background: white;
    }
    .form-group input:focus, .form-group select:focus { border-color: #8b5e83; }
    .modal-footer { display: flex; gap: 10px; padding: 0 20px 20px; }
    .btn-save {
      flex: 1; padding: 11px;
      background: linear-gradient(135deg, #8b5e83, #a07090);
      color: white; border: none; border-radius: 10px;
      font-size: 1rem; font-family: 'Heebo', sans-serif;
      cursor: pointer; font-weight: 600;
    }
    .btn-save:hover { opacity: 0.9; }
    .btn-cancel {
      padding: 11px 20px;
      background: #f0e8f0; color: #5a4a5a;
      border: none; border-radius: 10px;
      font-size: 1rem; font-family: 'Heebo', sans-serif;
      cursor: pointer;
    }
    .new-group-row { display: flex; gap: 6px; margin-top: 6px; }
    .new-group-row input { flex: 1; }
    .new-group-row button {
      padding: 9px 14px; background: #8b5e83; color: white;
      border: none; border-radius: 10px;
      font-family: 'Heebo', sans-serif; cursor: pointer; font-size: 0.85rem;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .stats-bar { gap: 6px; padding: 10px; }
      .stat-card { min-width: 90px; padding: 8px 10px; }
      .stat-card .num { font-size: 1.2rem; }
      .controls { padding: 10px; gap: 6px; }
      th, td { padding: 6px 6px; font-size: 0.78rem; }
      .num-input { width: 65px; padding: 4px 5px; }
      td.group-cell { display: none; }
    }
  </style>
</head>

<header>
  <h1>💍 מתנות החתונה</h1>
  <p>רשימת מוזמנים · הגיעו בפועל · מתנות · מעקב בזמן אמת</p>
</header>

<div class="stats-bar">
  <div class="stat-card gold">
    <div class="num" id="totalAmount">₪0</div>
    <div class="lbl">סה"כ מתנות</div>
  </div>
  <div class="stat-card green">
    <div class="num" id="paidCount">0</div>
    <div class="lbl">שילמו מתנה</div>
  </div>
  <div class="stat-card blue">
    <div class="num" id="arrivedTotal">0</div>
    <div class="lbl">הגיעו בפועל</div>
  </div>
  <div class="stat-card orange">
    <div class="num" id="expectedTotal">0</div>
    <div class="lbl">מוזמנים צפויים</div>
  </div>
  <div class="stat-card">
    <div class="num" id="remainCount">0</div>
    <div class="lbl">טרם הוזנה מתנה</div>
  </div>
  <div class="stat-card">
    <div class="num" id="totalGuests">362</div>
    <div class="lbl">סה"כ ברשימה</div>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="חפש שם מוזמן..." oninput="renderTable()">
    <span class="icon">🔍</span>
  </div>
  <select id="groupFilter" onchange="renderTable()">
    <option value="">כל הקבוצות</option>
  </select>
  <div class="filter-btns">
    <button class="filter-btn active" id="btn-all" onclick="setGiftFilter('all')">הכל</button>
    <button class="filter-btn" id="btn-paid" onclick="setGiftFilter('paid')">✅ שילמו</button>
    <button class="filter-btn" id="btn-unpaid" onclick="setGiftFilter('unpaid')">⏳ טרם הוזן</button>
    <button class="filter-btn" id="btn-arrived" onclick="setGiftFilter('arrived')">🟢 הגיעו</button>
  </div>
  <button class="add-btn" onclick="openModal('add')">➕ הוסף מוזמן</button>
  <button class="export-btn" onclick="exportExcel()">📥 ייצוא לאקסל</button>
</div>

<div class="table-wrapper">
  <div class="result-count" id="resultCount"></div>
  <table id="guestsTable">
    <thead>
      <tr>
        <th>שם מוזמן</th>
        <th>קבוצה</th>
        <th style="text-align:center">ציפי</th>
        <th style="text-align:center">הגיעו בפועל</th>
        <th style="text-align:center">מתנה (₪)</th>
        <th style="text-align:center">✏️</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-results" id="noResults" style="display:none">לא נמצאו תוצאות 🔍</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">➕ הוסף מוזמן</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>שם מוזמן *</label>
        <input type="text" id="fName" placeholder="לדוגמה: ישראל ישראלי">
      </div>
      <div class="form-group">
        <label>נייד</label>
        <input type="text" id="fPhone" placeholder="05X-XXXXXXX">
      </div>
      <div class="form-group">
        <label>כמה מגיעים (ציפי)</label>
        <input type="number" id="fCount" min="0" value="1">
      </div>
      <div class="form-group">
        <label>קבוצה</label>
        <select id="fGroup"></select>
        <div class="new-group-row">
          <input type="text" id="fGroupNew" placeholder="קבוצה חדשה...">
          <button onclick="addNewGroup()">הוסף</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-save" onclick="saveModal()">💾 שמור</button>
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

// ---- State ----
let guests = []; // working copy: GUESTS_DATA + custom
let gifts = {};       // id -> amount (₪)
let arrived = {};     // id -> count arrived
let guestEdits = {};  // id -> {name, phone, count, group} overrides
let customGuests = []; // manually added guests
let nextCustomId = 100000;
let giftFilter = 'all';

// ---- Persistence ----
function loadAll() {
  try { gifts = JSON.parse(localStorage.getItem('wedding_gifts_v1') || '{}'); } catch(e) { gifts = {}; }
  try { arrived = JSON.parse(localStorage.getItem('wedding_arrived_v1') || '{}'); } catch(e) { arrived = {}; }
  try { guestEdits = JSON.parse(localStorage.getItem('wedding_edits_v1') || '{}'); } catch(e) { guestEdits = {}; }
  try {
    customGuests = JSON.parse(localStorage.getItem('wedding_custom_v1') || '[]');
    if (customGuests.length) {
      nextCustomId = Math.max(nextCustomId, ...customGuests.map(g => g.id + 1));
    }
  } catch(e) { customGuests = []; }
}

function saveAll() {
  localStorage.setItem('wedding_gifts_v1', JSON.stringify(gifts));
  localStorage.setItem('wedding_arrived_v1', JSON.stringify(arrived));
  localStorage.setItem('wedding_edits_v1', JSON.stringify(guestEdits));
  localStorage.setItem('wedding_custom_v1', JSON.stringify(customGuests));
  updateStats();
}

function buildGuests() {
  // Base guests with edits applied
  const base = GUESTS_DATA.map(g => {
    const ed = guestEdits[g.id];
    return ed ? {...g, ...ed} : {...g};
  });
  guests = [...base, ...customGuests];
}

// ---- Stats ----
function updateStats() {
  buildGuests();
  const paid = guests.filter(g => Number(gifts[g.id] || 0) > 0);
  const total = paid.reduce((s, g) => s + Number(gifts[g.id] || 0), 0);
  const arrivedSum = guests.reduce((s, g) => s + Number(arrived[g.id] || 0), 0);
  const expectedSum = guests.reduce((s, g) => s + Number(g.count || 0), 0);
  document.getElementById('totalAmount').textContent = '₪' + total.toLocaleString('he-IL');
  document.getElementById('paidCount').textContent = paid.length;
  document.getElementById('arrivedTotal').textContent = arrivedSum;
  document.getElementById('expectedTotal').textContent = expectedSum;
  document.getElementById('remainCount').textContent = guests.length - paid.length;
  document.getElementById('totalGuests').textContent = guests.length;
}

// ---- Filters ----
function setGiftFilter(f) {
  giftFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + f).classList.add('active');
  renderTable();
}

// ---- Group filter dropdown ----
function populateGroupFilter() {
  const groups = [...new Set(guests.map(g => g.group).filter(Boolean))].sort();
  const sel = document.getElementById('groupFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">כל הקבוצות</option>';
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    if (g === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function populateModalGroups(selectVal) {
  const groups = [...new Set(guests.map(g => g.group).filter(Boolean))].sort();
  const sel = document.getElementById('fGroup');
  sel.innerHTML = '<option value="">ללא קבוצה</option>';
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    if (g === selectVal) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ---- Render Table ----
function renderTable() {
  buildGuests();
  populateGroupFilter();
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const groupSel = document.getElementById('groupFilter').value;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  let filtered = guests.filter(g => {
    const matchSearch = !search || g.name.toLowerCase().includes(search);
    const matchGroup = !groupSel || g.group === groupSel;
    const giftVal = Number(gifts[g.id] || 0);
    const arrVal = Number(arrived[g.id] || 0);
    const matchGift = giftFilter === 'all' ||
      (giftFilter === 'paid' && giftVal > 0) ||
      (giftFilter === 'unpaid' && giftVal === 0) ||
      (giftFilter === 'arrived' && arrVal > 0);
    return matchSearch && matchGroup && matchGift;
  });

  document.getElementById('resultCount').textContent =
    filtered.length + ' תוצאות מתוך ' + guests.length + ' מוזמנים';

  if (filtered.length === 0) {
    document.getElementById('noResults').style.display = '';
    document.getElementById('guestsTable').style.display = 'none';
    return;
  }
  document.getElementById('noResults').style.display = 'none';
  document.getElementById('guestsTable').style.display = '';

  // Group guests by group name, preserving original order
  const groupOrder = [];
  const groupMap = {};
  filtered.forEach(g => {
    const grp = g.group || 'ללא קבוצה';
    if (!groupMap[grp]) { groupMap[grp] = []; groupOrder.push(grp); }
    groupMap[grp].push(g);
  });

  const isGrouped = !document.getElementById('searchInput').value.trim(); // show headers only when not searching

  groupOrder.forEach(grp => {
    // Group header row (only when not in search mode or filter-by-gift)
    if (isGrouped) {
      const members = groupMap[grp];
      const grpGift = members.reduce((s,g) => s + Number(gifts[g.id]||0), 0);
      const grpArr  = members.reduce((s,g) => s + Number(arrived[g.id]||0), 0);
      const grpExp  = members.reduce((s,g) => s + Number(g.count||0), 0);
      const hdr = document.createElement('tr');
      hdr.classList.add('group-header');
      hdr.innerHTML = \`<td colspan="6">
        👨‍👩‍👧 \${escHtml(grp)}
        <span class="group-badge">\${members.length} משפחות/אנשים</span>
        <span style="font-size:0.78rem;color:#8a6a8a;margin-right:8px">ציפי: \${grpExp} | הגיעו: \${grpArr} | מתנות: ₪\${grpGift.toLocaleString('he-IL')}</span>
      </td>\`;
      tbody.appendChild(hdr);
    }

    groupMap[grp].forEach(g => {
      const giftVal = gifts[g.id] || '';
      const arrVal = arrived[g.id] || '';
      const hasGift = Number(giftVal) > 0;
      const hasArr = Number(arrVal) > 0;
      const isCustom = g.id >= 100000;
      const tr = document.createElement('tr');
      if (hasGift) tr.classList.add('has-gift');
      if (isCustom) tr.classList.add('custom-row');

      tr.innerHTML = \`
        <td class="name">\${escHtml(g.name)}\${isCustom ? ' <span style="font-size:0.7rem;color:#4a9a6a">●חדש</span>' : ''}</td>
        <td class="group-cell">\${escHtml(g.group || '')}</td>
        <td class="count">\${g.count}</td>
        <td class="num-cell">
          <input class="num-input arrived-input \${hasArr ? 'filled' : ''}"
            type="number" min="0" placeholder="כמה?"
            value="\${arrVal}" data-id="\${g.id}"
            onchange="updateArrived(this)" oninput="updateArrived(this)">
        </td>
        <td class="num-cell">
          <input class="num-input gift-input \${hasGift ? 'filled' : ''}"
            type="number" min="0" step="50" placeholder="סכום"
            value="\${giftVal}" data-id="\${g.id}"
            onchange="updateGift(this)" oninput="updateGift(this)">
        </td>
        <td>
          <div class="action-btns">
            <button class="action-btn edit-btn" title="עריכה" onclick="openModal('edit', \${g.id})">✏️</button>
            \${isCustom ? \`<button class="action-btn delete-btn" title="מחיקה" onclick="deleteGuest(\${g.id})">🗑️</button>\` : ''}
          </div>
        </td>
      \`;
      tbody.appendChild(tr);
    });
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Update gift/arrived ----
function updateGift(input) {
  const id = input.getAttribute('data-id');
  const val = Number(input.value);
  if (val > 0) { gifts[id] = val; input.classList.add('filled'); input.closest('tr').classList.add('has-gift'); }
  else { delete gifts[id]; input.classList.remove('filled'); input.closest('tr').classList.remove('has-gift'); }
  saveAll();
}

function updateArrived(input) {
  const id = input.getAttribute('data-id');
  const val = Number(input.value);
  if (val > 0) { arrived[id] = val; input.classList.add('filled'); }
  else { delete arrived[id]; input.classList.remove('filled'); }
  saveAll();
}

let modalMode = 'add';

function openModal(mode, id) {

    document.getElementById('fName').value = '';

    document.getElementById('fCount').value = 1;
    populateModalGroups('');
  } else {
    document.getElementById('modalTitle').textContent = '✏️ עריכת מוזמן';
    const g = guests.find(x => String(x.id) === String(id));
    if (!g) return;
    document.getElementById('editId').value = id;
    document.getElementById('fName').value = g.name;
    document.getElementById('fPhone').value = g.phone || '';
    document.getElementById('fCount').value = g.count || 1;
    populateModalGroups(g.group || '');
  }
  document.getElementById('fName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function addNewGroup() {
  const val = document.getElementById('fGroupNew').value.trim();
  if (!val) return;
  const sel = document.getElementById('fGroup');
  // check if exists
  const existing = [...sel.options].find(o => o.value === val);
  if (!existing) {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    sel.appendChild(opt);
  }
  sel.value = val;
  document.getElementById('fGroupNew').value = '';
}

function saveModal() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('שם מוזמן הוא שדה חובה'); return; }
  const phone = document.getElementById('fPhone').value.trim();
  const count = Number(document.getElementById('fCount').value) || 1;
  const group = document.getElementById('fGroup').value;
  const newGroupText = document.getElementById('fGroupNew').value.trim();
  const finalGroup = newGroupText || group;

  if (modalMode === 'add') {
    const newGuest = { id: nextCustomId++, name, phone, count, group: finalGroup, gift: 0 };
    customGuests.push(newGuest);
  } else {
    const id = document.getElementById('editId').value;
    const isCustom = Number(id) >= 100000;
    if (isCustom) {
      const idx = customGuests.findIndex(g => String(g.id) === String(id));
      if (idx >= 0) {
        customGuests[idx] = { ...customGuests[idx], name, phone, count, group: finalGroup };
      }
    } else {
      guestEdits[id] = { name, phone, count, group: finalGroup };
    }
  }

  closeModal();
  saveAll();
  renderTable();
}

function deleteGuest(id) {
  if (!confirm('למחוק את המוזמן מהרשימה?')) return;
  const idx = customGuests.findIndex(g => g.id === id);
  if (idx >= 0) {
    customGuests.splice(idx, 1);
    delete gifts[id];
    delete arrived[id];
    saveAll();
    renderTable();
  }
}

// ---- Export ----
function exportExcel() {
  buildGuests();
  const data = guests.map(g => ({
    'שם מוזמן': g.name,
    'נייד': g.phone,
    'ציפי (כמה מגיעים)': g.count,
    'הגיעו בפועל': Number(arrived[g.id] || 0),
    'קבוצה': g.group,
    'מתנה (₪)': Number(gifts[g.id] || 0)
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:25},{wch:14},{wch:14},{wch:14},{wch:28},{wch:14}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'מתנות חתונה');

  const paid = guests.filter(g => Number(gifts[g.id] || 0) > 0);
  const total = paid.reduce((s,g) => s + Number(gifts[g.id]||0), 0);
  const arrivedSum = guests.reduce((s,g) => s + Number(arrived[g.id]||0), 0);
  const expectedSum = guests.reduce((s,g) => s + Number(g.count||0), 0);
  const summaryData = [
    {'סטטיסטיקה': 'סה"כ מתנות', 'ערך': '₪' + total.toLocaleString('he-IL')},
    {'סטטיסטיקה': 'שילמו מתנה', 'ערך': paid.length + ' קבוצות'},
    {'סטטיסטיקה': 'הגיעו בפועל', 'ערך': arrivedSum + ' אנשים'},
    {'סטטיסטיקה': 'ציפי', 'ערך': expectedSum + ' אנשים'},
    {'סטטיסטיקה': 'טרם הוזנה מתנה', 'ערך': (guests.length - paid.length) + ' קבוצות'},
    {'סטטיסטיקה': 'סה"כ ברשימה', 'ערך': guests.length + ' קבוצות'},
  ];
  const ws2 = XLSX.utils.json_to_sheet(summaryData);
  XLSX.utils.book_append_sheet(wb, ws2, 'סיכום');

  XLSX.writeFile(wb, 'מתנות_חתונה.xlsx');
}

loadAll();
buildGuests();
populateGroupFilter();
renderTable();
updateStats();
